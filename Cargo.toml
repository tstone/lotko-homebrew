[package]
name = "lotko"
version = "0.1.0"
edition = "2024"

[dependencies]
env_logger = "0.11.11"
frontbox-core = { path = "../frontbox-rs/frontbox-core" }
frontbox-pinball = { path = "../frontbox-rs/frontbox-pinball" }
frontbox-dmd = { path = "../frontbox-rs/frontbox-dmd" }
frontbox-sound = { path = "../frontbox-rs/frontbox-sound" }
frontbox-gfx = { path = "../frontbox-rs/frontbox-gfx" }
frontbox-led = { path = "../frontbox-rs/frontbox-led" }
frontbox-console = { path = "../frontbox-rs/frontbox-console" }
tokio = { version = "1.53.1", features = ["full"] }
log = "0.4.33"
image = "0.25.10"
rand = "0.10.2"
serde = "1.0.229"
serde_json = "1.0.151"
dyn-clone = "1.0.20"
itertools = "0.15.0"

[profile.dev]
opt-level = 0
debug = 1

[profile.dev.package."*"]
opt-level = 3 # optimize all dependencies fully

[profile.release]
lto = true        # link-time optimization; slower builds, faster/smaller binary
codegen-units = 1 # trade parallel compile time for better cross-crate inlining
panic = "abort"   # skip unwinding machinery — smaller binary, faster panics
strip = true      # strip debug symbols from the final binary
